<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Sentinel admin</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <script defer src="/js/admin.js"></script>
</head>
<body class="min-h-screen" data-page="admin">
  <main class="max-w-6xl mx-auto px-4 py-10">
    <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
      <div>
        <p class="text-xs uppercase tracking-[0.16em] text-teal mb-1">Private</p>
        <h1 class="font-display text-3xl text-white">Sentinel admin</h1>
      </div>
      <p class="text-xs text-slate-500">Protect this page and /api/admin/* with Cloudflare Access.</p>
    </div>

    <form id="loginForm" class="glass rounded-3xl p-5 mb-6 flex flex-col sm:flex-row gap-3" autocomplete="off">
      <label class="sr-only" for="adminKey">Admin key</label>
      <input id="adminKey" type="password" placeholder="Admin key" class="flex-1 rounded-xl bg-black/40 border border-white/10 px-3 py-2.5 text-sm text-white focus:outline-none focus:border-teal/50" />
      <button type="submit" class="px-5 py-2.5 rounded-xl bg-white text-ink font-bold text-sm">Load</button>
    </form>
    <p id="adminStatus" class="text-sm text-slate-400 mb-4" role="status"></p>

    <div id="adminBody" class="hidden space-y-6">
      <div id="adminCounts" class="grid grid-cols-2 lg:grid-cols-5 gap-3"></div>
      <section class="glass rounded-3xl p-5 overflow-x-auto">
        <h2 class="text-white font-semibold mb-3">Latest checks</h2>
        <table class="w-full text-sm"><thead><tr class="text-left text-slate-400">
          <th class="py-2 pr-3">Time</th><th class="pr-3">Site</th><th class="pr-3">Status</th><th class="pr-3">PHP</th><th class="pr-3">Framework</th><th>Country</th>
        </tr></thead><tbody id="scanRows"></tbody></table>
      </section>
      <section class="glass rounded-3xl p-5 overflow-x-auto">
        <h2 class="text-white font-semibold mb-3">Waitlist</h2>
        <table class="w-full text-sm"><thead><tr class="text-left text-slate-400">
          <th class="py-2 pr-3">Time</th><th class="pr-3">Email</th><th class="pr-3">Role</th><th class="pr-3">Interests</th><th>Site</th>
        </tr></thead><tbody id="waitRows"></tbody></table>
      </section>
      <section class="glass rounded-3xl p-5 overflow-x-auto">
        <h2 class="text-white font-semibold mb-3">Messages</h2>
        <table class="w-full text-sm"><thead><tr class="text-left text-slate-400">
          <th class="py-2 pr-3">Time</th><th class="pr-3">Email</th><th class="pr-3">Call?</th><th class="pr-3">Source</th><th>Message</th>
        </tr></thead><tbody id="msgRows"></tbody></table>
      </section>
      <section class="glass rounded-3xl p-5 overflow-x-auto">
        <h2 class="text-white font-semibold mb-3">Reports (opt-out, removal, abuse, security)</h2>
        <table class="w-full text-sm"><thead><tr class="text-left text-slate-400">
          <th class="py-2 pr-3">Time</th><th class="pr-3">Kind</th><th class="pr-3">Domain</th><th class="pr-3">Email</th><th>Details</th>
        </tr></thead><tbody id="reportRows"></tbody></table>
      </section>
    </div>
  </main>
</body>
</html>
