<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHP Sentinel Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="robots" content="noindex, nofollow" />
</head>
<body class="bg-slate-100 p-6 font-sans">
  <h1 class="text-xl font-bold mb-4">PHP Sentinel Admin</h1>
  <p class="text-sm text-slate-600 mb-4">Add <code>?key=YOUR_ADMIN_SECRET</code> to this page URL, or enter the key below.</p>
  <input id="key" type="password" placeholder="Admin secret" class="border px-3 py-2 rounded mr-2" />
  <button id="load" class="bg-slate-900 text-white px-4 py-2 rounded">Load</button>
  <div id="stats" class="mt-6 grid grid-cols-2 sm:grid-cols-5 gap-3"></div>
  <div class="mt-6 overflow-x-auto bg-white rounded-xl border">
    <table class="min-w-full text-sm">
      <thead class="bg-slate-50 text-left">
        <tr>
          <th class="p-3">Time</th><th class="p-3">Status</th><th class="p-3">URL</th>
          <th class="p-3">Version</th><th class="p-3">Framework</th><th class="p-3">Country</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("key")) document.getElementById("key").value = params.get("key");

    document.getElementById("load").onclick = async () => {
      const key = document.getElementById("key").value.trim();
      const res = await fetch("/api/admin/scans?key=" + encodeURIComponent(key));
      if (!res.ok) { alert("Unauthorized or error"); return; }
      const data = await res.json();
      document.getElementById("stats").innerHTML = (data.counts || []).map(c =>
        `<div class="bg-white border rounded-xl p-3"><div class="text-xs text-slate-500">${c.status}</div><div class="text-xl font-semibold">${c.c}</div></div>`
      ).join("");
      document.getElementById("rows").innerHTML = (data.scans || []).map(s =>
        `<tr class="border-t">
          <td class="p-3 whitespace-nowrap">${s.created_at || ""}</td>
          <td class="p-3">${s.status || ""}</td>
          <td class="p-3 max-w-xs truncate">${s.normalized_url || s.url || ""}</td>
          <td class="p-3">${s.php_version || ""}</td>
          <td class="p-3">${s.framework || ""}</td>
          <td class="p-3">${s.country || ""}</td>
        </tr>`
      ).join("");
    };
  </script>
</body>
</html>
